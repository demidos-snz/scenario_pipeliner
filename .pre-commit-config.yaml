# Local quality gates aligned with .github/workflows/ci.yml
# (scenario_pipeliner job: ruff check, ruff format, mypy, pytest).
#
# Install once:
#   uv sync --dev
#   uv run pre-commit install
#
# Run all hooks:
#   uv run pre-commit run --all-files
fail_fast: false
default_stages: [pre-commit]
exclude: ^(plugins/|REVIEW\.md|ROADMAP\.md)

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
