name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scenario_pipeliner:
    name: scenario_pipeliner (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ./uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  scenario_pipeliner_postgres_smoke:
    name: scenario_pipeliner (postgres smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ./uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Core migrate (postgres)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        run: >
          uv run python -m scenario_pipeliner.cli db migrate-core
          --db-backend postgresql
          --postgres-host "$POSTGRES_HOST"
          --postgres-port "$POSTGRES_PORT"
          --postgres-db "$POSTGRES_DB"
          --postgres-user "$POSTGRES_USER"
          --postgres-password "$POSTGRES_PASSWORD"

      - name: Pytest migrate-core postgres smoke
        env:
          SCENARIO_PIPELINER_RUN_POSTGRES_TESTS: "1"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        run: uv run pytest tests/test_dry_run_and_cli.py -k "migrate_core_postgresql_smoke"

      - name: Pytest worker cycle
        run: uv run pytest tests/test_worker_runner_db.py

  release_dry_run:
    name: release dry-run (build + twine)
    runs-on: ubuntu-latest
    needs:
      - scenario_pipeliner
      - scenario_pipeliner_postgres_smoke
    defaults:
      run:
        working-directory: ./
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ./uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Build dist
        run: uv build

      - name: Twine check
        run: uv run twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scenario-pipeliner-dist
          path: ./dist/*

      - name: Publish to TestPyPI (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
